services:
  incidenttracker-frontend:
    build:
      context: .
      args:
        - NEXT_PUBLIC_apiurl=http://192.168.9.227:3002/api/v1
        - NEXT_PUBLIC_deathreport=http://192.168.9.227:3003/dashboard/death-reports
    ports:
      - "3003:3000"
    env_file:
      - ".env"
    extra_hosts:
      - "host.docker.internal:host-gateway"
